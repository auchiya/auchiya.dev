name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  # Single job handling validation, building, and environment-based deployments
  build-and-deploy:
    # Filter conditions for production deployment vs pull request preview
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)

    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/master' && 'production' || 'preview') }}

    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && format('deploy-{0}-{1}', inputs.environment, github.run_id) || (github.event_name == 'pull_request' && format('preview-pr-{0}', github.event.pull_request.number) || format('prod-{0}', github.ref)) }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: true

      - name: Run Checks
        run: vp check

      # - name: Run Tests
      #   run: vp test
      #
      - name: Build frontend
        run: vpr build

      # Deploy Production
      - name: Deploy Production Worker
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: vp dlx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy Preview (PR only or manual preview selection)
      - name: Deploy Preview Worker
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.environment == 'preview')
        run: vp dlx wrangler@4 versions upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        with:
          script: |
            const fs = require('fs');
            const outputFile = process.env.WRANGLER_OUTPUT_FILE_PATH;
            let previewUrl = null;

            if (fs.existsSync(outputFile)) {
              const lines = fs.readFileSync(outputFile, 'utf8').trim().split('\n');
              for (const line of lines) {
                try {
                  const entry = JSON.parse(line);
                  if (entry.type === 'version-upload' && (entry.preview_url || entry.targets?.[0])) {
                    previewUrl = entry.preview_url || entry.targets[0];
                    break;
                  }
                } catch {}
              }
            }

            if (!previewUrl) {
              core.warning('Could not parse preview URL from wrangler output');
              return;
            }

            const body = `🚀 **Preview deployment ready**\n\n${previewUrl}`;
            const prNumber = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });

            const marker = '<!-- cloudflare-preview-url -->';
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body: `${marker}\n${body}`,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body: `${marker}\n${body}`,
              });
            }
