name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_WORKER: auchiya-dev
      RESPONSE_STORE_BUCKET: auchiya-dev-response-store-cache-bodies
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: lts
          cache: true

      # Builds the app Worker and the auxiliary Response Store Worker.
      - name: Build
        run: pnpm run build

      # cf deploy --prebuilt does not create a missing R2 bucket from the
      # generated bindings, so provision the Response Store bucket first.
      - name: Ensure Response Store R2 bucket exists
        run: pnpm exec cf r2 buckets get "$RESPONSE_STORE_BUCKET" > /dev/null 2>&1 || pnpm exec cf r2 buckets create-by-name "$RESPONSE_STORE_BUCKET"

      # The app deploy never deploys the Response Store, so update it first.
      - name: Deploy Response Store Worker
        run: pnpm run deploy:response-store

      # Cache warming stages a new version against the currently deployed one,
      # so it is only available after the first deployment.
      - name: Check for an existing app deployment
        id: app-worker
        run: |
          if pnpm exec cf workers get "$APP_WORKER" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy app Worker
        run: |
          if [ "${{ steps.app-worker.outputs.exists }}" = "true" ]; then
            pnpm exec vinext-cloudflare deploy --skip-build --warm-cache
          else
            pnpm exec vinext-cloudflare deploy --skip-build
          fi
