name: Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)

    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/master' && 'production' || 'preview') }}

    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && format('deploy-{0}-{1}', inputs.environment, github.run_id) || (github.event_name == 'pull_request' && format('preview-pr-{0}', github.event.pull_request.number) || format('prod-{0}', github.ref)) }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: true

      - name: Run Checks
        run: vp check

      - name: Run tests
        run: vp test

      # Build once for production — both deploy steps below use --prebuilt
      # Preview deploys skip this: cf previews deploy builds itself with isPreview=true
      - name: Build frontend
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: vpr build

      # Deploy Response Store Worker (must deploy BEFORE the app — service binding target must exist)
      - name: Deploy Response Store Worker
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: vpx cf deploy --prebuilt --mode production --worker auchiya-dev-response-store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy Production — uses --prebuilt (no rebuild, reuses vpr build output)
      - name: Deploy Production Worker
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: vpx cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy Preview — builds itself with isPreview=true, no prior build needed
      - name: Deploy Preview Worker
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.environment == 'preview')
        id: preview
        run: |
          set -o pipefail
          output="$(vpx cf previews deploy --mode staging 2>&1)" || true
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | sed -n '/^{/,/^}/p' | jq -er '.preview_urls[0]' 2>/dev/null || true)"
          if [ -n "$preview_url" ]; then
            echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `${{ steps.preview.outputs.preview_url }}`;
            if (!previewUrl) {
              core.warning('Could not parse preview URL from cf previews deploy output');
              return;
            }

            const body = `🚀 **Preview deployment ready**\n\n${previewUrl}`;
            const prNumber = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });

            const marker = '<!-- cloudflare-preview-url -->';
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body: `${marker}\n${body}`,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body: `${marker}\n${body}`,
              });
            }
